name: 📚 Docs build (Staging)

# Build check + stale-reference PR for `staging`. Deployment is done by Vercel
# (git integration on main), not by this workflow. See af-deploy-common.yml.

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - staging

jobs:
  build-docs:
    uses: ./.github/workflows/af-deploy-common.yml
    with:
      environment: staging
      branch: staging
    secrets:
      gh_pat: ${{ secrets.GH_PAT }}
      docs_bot_token: ${{ secrets.DOCS_BOT_TOKEN }}
