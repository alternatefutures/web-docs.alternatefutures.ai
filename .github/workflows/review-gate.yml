# Review Gate is DISABLED (by request, across all repos).
#
# This small valid header exists because a comments-only workflow file makes
# GitHub report "This run likely failed because of a workflow file issue" on
# EVERY push. The stub only runs on manual dispatch and deliberately does not
# post the "Quinn-first, then Senku + Lain" status that main's branch protection
# still lists as a required check. To re-enable: delete this header, uncomment
# the original workflow below (or restore it from git history).
name: Review Gate (disabled)
on:
  workflow_dispatch:
permissions: {}
jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Review Gate is disabled. The original workflow is kept commented out in this file."

