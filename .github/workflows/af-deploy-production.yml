name: 📚 Docs build (Production)

# Build check + stale-reference PR for `main`. Deployment is done by Vercel
# (git integration on main), not by this workflow. See af-deploy-common.yml.

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Sent by alternate-clouds-cli npm-publish.yml after a release (docs-update) and
  # by the SDK repo (Release): regenerates the references and opens a PR on drift.
  repository_dispatch:
    types: [docs-update, Release]

jobs:
  build-docs:
    uses: ./.github/workflows/af-deploy-common.yml
    with:
      environment: production
      branch: main
    secrets:
      gh_pat: ${{ secrets.GH_PAT }}
