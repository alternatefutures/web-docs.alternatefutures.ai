name: ⚡️ Deploy Documentation (Common)
permissions:
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      branch:
        required: true
        type: string
      network:
        required: false
        type: string
        default: ipfs
    secrets:
      af_api_key:
        required: true
      gh_pat:
        required: false

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  AF_API_KEY: ${{ secrets.af_api_key }}

jobs:
  deploy-to-alternate-futures:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Checkout alternate-clouds-cli repo
        uses: actions/checkout@v4
        with:
          repository: alternatefutures/alternate-clouds-cli
          path: alternate-clouds-cli
          ref: main
          token: ${{ secrets.gh_pat || github.token }}

      # SDK default branch is develop; main has been stale since 2025-12-29 and
      # carries observability.ts, which breaks TypeDoc (see PR #34 / issue #33).
      - name: Checkout alternate-clouds-sdk repo
        uses: actions/checkout@v4
        with:
          repository: alternatefutures/alternate-clouds-sdk
          path: alternate-clouds-sdk
          ref: develop
          token: ${{ secrets.gh_pat || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (docs)
        run: pnpm install

      # Both generators parse the checked-out source repos statically —
      # no install/build of the CLI or SDK is needed.
      - name: Generate CLI documentation
        run: pnpm generate:cli
        env:
          AF_CLI_REPO: ${{ github.workspace }}/alternate-clouds-cli

      - name: Generate SDK documentation
        continue-on-error: true
        run: pnpm generate:sdk
        env:
          AF_SDK_REPO: ${{ github.workspace }}/alternate-clouds-sdk

      - name: Build (Next.js static export)
        run: pnpm build

      # DEPLOY IS KNOWN-BROKEN (issue #33): this path has not worked since
      # 2025-12-29 — the live site is a manual Vercel deploy. `acc` has no
      # `sites` command; the legacy `af` CLI is abandoned at 0.3.0 and needs an
      # AF CI token nobody has minted. Options per PR #34: mint a token for this
      # path, or replace with an SDK-based script (storage.uploadDirectory +
      # sites.createCustomIpfsDeployment). Until then Vercel serves the site
      # (vercel.json is updated for the Next.js build).
      - name: Install Alternate Futures CLI (legacy af, for sites deploy)
        run: npm install -g @alternatefutures/cli

      # CLI reads af.config.json for site slug and distDir (out/)
      - name: Deploy to Alternate Futures
        run: af sites deploy
