name: 📚 Docs build (Common)

# Reusable build check for the docs site. It does NOT deploy: docs.alternatefutures.ai
# is deployed by Vercel from the `main` branch (git integration; vercel.json
# `framework: null` serves the static export in out/). Vercel runs only
# `pnpm run build`, so the live site always shows the COMMITTED CLI/SDK reference.
# This workflow regenerates those references from the source repos and, when the
# committed copy is stale, opens a pull request with the regenerated files —
# merging that PR is what updates the live reference.
#
# History: until 2026-09-08 this workflow ended with `npm i -g @alternatefutures/cli
# && af sites deploy`. That package is frozen at 0.3.0 and has no `sites` command,
# so the step printed the CLI help and exited 0 without deploying anything
# (issue #33; run 34127305643 was a false green).

on:
  workflow_call:
    inputs:
      environment:
        description: Label for the artifact and PR branch (production | staging | develop)
        required: true
        type: string
      branch:
        description: Docs branch to build and, on drift, target with the PR
        required: true
        type: string
    secrets:
      gh_pat:
        description: Token that can read the private source repos (alternate-clouds-cli, alternate-clouds-sdk, alternate-clouds-api)
        required: false
      docs_bot_token:
        description: Token allowed to push regenerated references straight to the protected branch (admin PAT or bypass actor). Without it the workflow falls back to a pull request.
        required: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the bot branch with regenerated references
      pull-requests: write   # open/update the "regenerate references" PR
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      # Private repo: needs gh_pat. github.token only works inside this repo.
      - name: Checkout alternate-clouds-cli repo
        uses: actions/checkout@v7
        with:
          repository: alternatefutures/alternate-clouds-cli
          path: alternate-clouds-cli
          ref: main
          token: ${{ secrets.gh_pat || github.token }}

      # "Merged to main is final": the SDK reference tracks main (main and
      # develop were reconciled on 2026-09-11; before that main was stale).
      - name: Checkout alternate-clouds-sdk repo
        uses: actions/checkout@v7
        with:
          repository: alternatefutures/alternate-clouds-sdk
          path: alternate-clouds-sdk
          ref: main
          token: ${{ secrets.gh_pat || github.token }}

      # The GraphQL schema reference and the template catalog come from the API
      # server source (private repo, needs gh_pat). No install: the generators
      # read typeDefs.ts and run the template registry, which has no dependencies.
      - name: Checkout alternate-clouds-api repo
        uses: actions/checkout@v7
        with:
          repository: alternatefutures/alternate-clouds-api
          path: alternate-clouds-api
          ref: main
          token: ${{ secrets.gh_pat || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Version comes from package.json `packageManager` (pnpm@10.x). Passing
      # `version:` here too makes action-setup fail with
      # "Multiple versions of pnpm specified" (runs 34120434578, 34124739136).
      - uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (docs)
        run: pnpm install

      # The CLI generator parses source statically (no install). The SDK
      # generator runs TypeDoc, which needs the SDK's dependencies to resolve
      # types: without them every return type renders as `any` and source
      # links lose the `src/` prefix, so the committed reference (generated
      # locally with deps) never matches and the drift PR reopens on every run
      # (PR #36). Install them; the generator falls back to a synthesized
      # tsconfig only if this step fails.
      - name: Install SDK dependencies (for TypeDoc type resolution)
        continue-on-error: true
        working-directory: alternate-clouds-sdk
        run: pnpm install --frozen-lockfile --ignore-scripts || pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Generate CLI documentation
        run: pnpm generate:cli
        env:
          AF_CLI_REPO: ${{ github.workspace }}/alternate-clouds-cli

      - name: Generate SDK documentation
        continue-on-error: true
        run: pnpm generate:sdk
        env:
          AF_SDK_REPO: ${{ github.workspace }}/alternate-clouds-sdk

      - name: Generate GraphQL API reference
        run: pnpm generate:api
        env:
          AF_API_REPO: ${{ github.workspace }}/alternate-clouds-api

      # Visibility comes from the production API's public `templates` query
      # (platform feature flags live in its database). If production is
      # unreachable the generator exits 1 and the committed catalog stands.
      - name: Generate template catalog
        continue-on-error: true
        run: pnpm generate:templates
        env:
          AF_API_REPO: ${{ github.workspace }}/alternate-clouds-api

      # Builds with the REGENERATED references, so a PR below never proposes
      # MDX that does not compile.
      - name: Build (Next.js static export)
        run: pnpm build

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-site-${{ inputs.environment }}
          path: out/
          retention-days: 7

      - name: Detect stale committed references
        id: drift
        shell: bash
        run: |
          set -euo pipefail
          FILES="$(node scripts/lib/generated-files.mjs)"
          CHANGED="$(git status --porcelain -- $FILES | awk '{print $2}')"
          CLI_SHA="$(git -C alternate-clouds-cli rev-parse --short HEAD)"
          SDK_SHA="$(git -C alternate-clouds-sdk rev-parse --short HEAD)"
          API_SHA="$(git -C alternate-clouds-api rev-parse --short HEAD)"
          {
            echo "cli_sha=$CLI_SHA"
            echo "sdk_sha=$SDK_SHA"
            echo "api_sha=$API_SHA"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ Committed CLI/SDK references match the source repos (cli@$CLI_SHA, sdk@$SDK_SHA)." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=Generated references are stale::$(echo $CHANGED | tr '\n' ' ') differ from the source repos; a PR with the regenerated files is opened/updated below."
            {
              echo "## ⚠️ Committed references are stale"
              echo
              echo "Regenerated from alternate-clouds-cli@$CLI_SHA, alternate-clouds-sdk@$SDK_SHA and alternate-clouds-api@$API_SHA (all main):"
              echo
              for f in $CHANGED; do echo "- \`$f\`"; done
              echo
              echo "A pull request with these files is opened/updated on branch \`bot/regenerate-references-${{ inputs.branch }}\`. Merging it updates the live site (Vercel deploys \`main\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # "Merged to main is final": push the regenerated references straight to
      # the built branch so Vercel republishes with no click. Needs a token that
      # may push to the protected branch (docs_bot_token: a PAT, classic or
      # fine-grained, owned by an admin or a bypass actor of the branch rule).
      # The push re-triggers this workflow once; that run finds no drift and
      # stops. If the push is refused (no token / protection), the PR step below
      # takes over.
      #
      # actions/checkout persists the run's GITHUB_TOKEN as
      # `http.https://github.com/.extraheader`. git sends that header even when
      # the push URL carries other credentials, so the push authenticated as
      # github-actions[bot] and was refused with GH006 "Changes must be made
      # through a pull request" (runs 34519788471, 34523579595, 34524671483,
      # 34525906731; a fine-grained AND a classic admin PAT). `-c ...extraheader=`
      # clears the list for this one command so the URL credential is the identity.
      - name: Commit regenerated references directly
        id: direct
        if: steps.drift.outputs.changed == 'true'
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.docs_bot_token }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::notice::docs_bot_token not set; leaving the regenerated references to the pull request step."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(node scripts/lib/generated-files.mjs)
          git commit -m "docs: regenerate references (cli@${{ steps.drift.outputs.cli_sha }}, sdk@${{ steps.drift.outputs.sdk_sha }}, api@${{ steps.drift.outputs.api_sha }})"
          # Evidence for the run log: which account pushes (a login is not a secret). A bad token fails here; the PR step takes over.
          echo "Pushing as $(curl -fsS -H "Authorization: Bearer ${TOKEN}" https://api.github.com/user | jq -r .login)"
          git -c http.https://github.com/.extraheader= push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${{ inputs.branch }}"
          echo "✅ Regenerated references pushed to ${{ inputs.branch }}; Vercel deploys them." | tee -a "$GITHUB_STEP_SUMMARY"

      # Fallback and janitor. Runs on EVERY build: with no diff it is a no-op,
      # after a successful direct push it sees no changes and closes any stale
      # drift PR, and when the direct push was refused it opens/updates the PR
      # (run #53 left PR #35 open because this step was once gated on drift).
      - name: Open, update, or close the regenerated-references PR
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ inputs.branch }}
          branch: bot/regenerate-references-${{ inputs.branch }}
          delete-branch: true
          add-paths: |
            content/docs/cli/commands.mdx
            content/docs/sdk/api.mdx
            content/docs/api/queries.mdx
            content/docs/api/mutations.mdx
            content/docs/api/objects.mdx
            content/docs/api/inputs.mdx
            content/docs/api/enums.mdx
            content/docs/templates/catalog.mdx
          commit-message: "docs: regenerate references"
          title: "docs: regenerate references"
          body: |
            Automated by `📚 Docs build` — the committed generated references no longer match the source repos.

            - `alternate-clouds-cli` @ `${{ steps.drift.outputs.cli_sha }}` (main) → `content/docs/cli/commands.mdx`
            - `alternate-clouds-sdk` @ `${{ steps.drift.outputs.sdk_sha }}` (main) → `content/docs/sdk/api.mdx`
            - `alternate-clouds-api` @ `${{ steps.drift.outputs.api_sha }}` (main) → `content/docs/api/*.mdx`, `content/docs/templates/catalog.mdx`

            Triggered by `${{ github.event_name }}` on `${{ inputs.branch }}` (run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).
            Merging deploys the update via Vercel. Do not edit these files by hand — rerun the generators instead.

      # Hand-written pages vs the CLI. Runs last so the reference update above
      # has already landed; it fails THIS run when a tutorial or guide types a
      # command or flag the CLI no longer has (findings in the job summary).
      - name: Check hand-written pages against the CLI
        run: pnpm check:cli-drift
        env:
          AF_CLI_REPO: ${{ github.workspace }}/alternate-clouds-cli
